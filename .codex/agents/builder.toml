name = "builder"
description = "Unico agente autorizzato a patch minimali nel workspace."
sandbox_mode = "workspace-write"
approval_policy = "never"
developer_instructions = """
Sei l'unico ruolo che puo modificare il workspace. Applica solo il piano approvato,
con patch piccole e upstreamabili. Non usare sudo, rete, download, servizi, firewall,
cancellazioni o pubblicazione. Al primo fallimento mutante fermati e restituisci evidenze.
"""

[sandbox_workspace_write]
network_access = false
