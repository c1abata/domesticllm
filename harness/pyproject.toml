[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domesticllm-harness"
version = "0.1.0"
description = "Local, operator-controlled client harness for DomesticLLM servers"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DomesticLLM contributors"}]
dependencies = []

[project.scripts]
domestic-harness = "domestic_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["domestic_harness*"]
