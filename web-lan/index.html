<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DomesticLLM</title>
<style>body{margin:0;background:#0c1017;color:#e7edf7;font:16px system-ui}.app{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.badge{color:#8fe3ad}.grid{display:grid;grid-template-columns:310px 1fr;gap:18px}section{background:#151c27;border:1px solid #27344a;border-radius:12px;padding:16px}label{display:block;margin-top:10px;color:#aebed5}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px;border-radius:7px;border:1px solid #3b4d69;background:#0c1017;color:#eef}textarea{min-height:100px}button{background:#4d86ff;border:0;margin-top:14px;cursor:pointer;font-weight:650}pre{white-space:pre-wrap;min-height:300px;margin:0;line-height:1.5}.small{font-size:.85rem;color:#aebed5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style>
<body><main class="app"><div class="top"><h1>DomesticLLM</h1><span id="status" class="badge">Connessione…</span></div><p id="session" class="small">Stato sessione in caricamento…</p><p class="small">Chat locale in LAN. La web app non richiede login; gli endpoint API /v1 richiedono Bearer token.</p><div class="grid"><section><label>Modello<select id="model"></select></label><label>Prompt di sistema<textarea id="system">Sei un assistente utile, diretto e competente.</textarea></label><label>Temperatura<input id="temperature" type="number" min="0" max="2" step=".05" value="0.7"></label><div class="row"><label>Max token<input id="tokens" type="number" min="1" max="4096" value="1024"></label><label>Top P<input id="topP" type="number" min="0" max="1" step=".05" value="0.95"></label></div><details><summary>Generazione avanzata</summary><div class="row"><label>Seed<input id="seed" type="number" value="-1"></label><label>Top K<input id="topK" type="number" min="0" value="40"></label></div><div class="row"><label>Min P<input id="minP" type="number" min="0" max="1" step=".01" value="0"></label><label>Repeat penalty<input id="repeatPenalty" type="number" min="0" step=".01" value="1"></label></div><div class="row"><label>Presence penalty<input id="presencePenalty" type="number" step=".01" value="0"></label><label>Frequency penalty<input id="frequencyPenalty" type="number" step=".01" value="0"></label></div><label>Stop (una sequenza per riga)<textarea id="stop" placeholder="Opzionale"></textarea></label></details><details><summary>Runtime avanzato</summary><label>Contesto<select id="context"><option>2048</option><option>4096</option><option selected>8192</option><option>16384</option></select></label><label>Slot<select id="parallel"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Flash Attention<select id="flash"><option>auto</option><option>on</option><option>off</option></select></label><label>KV cache<select id="kv"><option>q4_0</option><option selected>q8_0</option><option>f16</option></select></label></details></section><section><pre id="chat"></pre><textarea id="prompt" placeholder="Scrivi un messaggio…"></textarea><button id="send">Invia</button></section></div></main><script>
const $=id=>document.getElementById(id),chat=$('chat');let messages=[];const show=x=>chat.textContent=x,fmt=x=>Number.isFinite(x)?x.toFixed(1):'—';async function get(p){let r=await fetch(p);if(!r.ok)throw Error(await r.text());return r.json()}function session(state){let s=state.session||{},g=s.last_generation;if(!state.active_model){$('session').textContent='Nessuna sessione GPU attiva';return}$('session').textContent=`Sessione: ${s.requests||0} richieste · ${Math.round(s.elapsed_seconds||0)} s · contesto ${s.runtime?.context||'profilo'}${g?` · prefill ${g.prompt_tokens??'—'} tok a ${fmt(g.prefill_tokens_per_second)} tok/s · generazione ${g.generated_tokens??'—'} tok a ${fmt(g.generation_tokens_per_second)} tok/s`:''}`}async function refresh(){let [models,state]=await Promise.all([get('/ui/models'),get('/ui/status')]);$('model').innerHTML=models.data.map(x=>`<option value="${x.id}" ${x.ready?'':'disabled'}>${x.id}${x.ready?'':' — non disponibile'}</option>`).join('');$('status').textContent=state.active_model?`Attivo: ${state.active_model}`:'Nessun modello caricato';session(state)}async function send(){let prompt=$('prompt').value.trim();if(!prompt)return;messages.push({role:'user',content:prompt});$('prompt').value='';show(messages.map(m=>`${m.role==='user'?'Tu':'Assistente'}: ${m.content}`).join('\n\n')+'\n\nCaricamento…');let stop=$('stop').value.split('\n').map(x=>x.trim()).filter(Boolean),payload={model:$('model').value,messages:[{role:'system',content:$('system').value},...messages],temperature:Number($('temperature').value),top_p:Number($('topP').value),top_k:Number($('topK').value),min_p:Number($('minP').value),repeat_penalty:Number($('repeatPenalty').value),presence_penalty:Number($('presencePenalty').value),frequency_penalty:Number($('frequencyPenalty').value),seed:Number($('seed').value),max_tokens:Number($('tokens').value),runtime:{context:Number($('context').value),parallel:Number($('parallel').value),flash_attention:$('flash').value,kv_cache:$('kv').value}};if(stop.length)payload.stop=stop;try{let r=await fetch('/ui/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),x=await r.json();if(!r.ok)throw Error(x.error?.message||JSON.stringify(x));let answer=x.choices?.[0]?.message?.content||JSON.stringify(x);messages.push({role:'assistant',content:answer});show(messages.map(m=>`${m.role==='user'?'Tu':'Assistente'}: ${m.content}`).join('\n\n'));refresh()}catch(e){show('Errore: '+e.message)}}$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};refresh().catch(e=>show('Errore di connessione: '+e.message));</script></body></html>
