# Merge into ~/.hermes/config.yaml. This file contains no secret.
providers:
  pds4:
    api: http://127.0.0.1:18080/v1
    transport: chat_completions
    models:
      qwen3-coder-q4:
        context_length: 16384
      dolphin-mistral-24b-q4:
        context_length: 16384
      dolphin-cyber-8b-q4:
        context_length: 8192

model:
  provider: custom:pds4
  default: dolphin-cyber-8b-q4
  context_length: 8192

terminal:
  backend: local
  timeout: 300

approvals:
  mode: manual
  timeout: 120

telegram:
  require_mention: true
  reactions: true
